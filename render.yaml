# Render Blueprint: one-click deploy of the website + EHR.
# On render.com: New > Blueprint > pick this repo. You'll be asked for the two
# secret values below (your admin email and a strong password).
#
# The persistent disk keeps the SQLite database across deploys; it needs a paid
# instance type (the free tier has no disk and would erase data on every restart).
# Do NOT store real patient information unless your hosting account is covered by a
# signed BAA. See README "Before using real PHI".
services:
  - type: web
    name: clinic-ready
    runtime: node
    plan: starter
    rootDir: ehr
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: ehr-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: EHR_DB_PATH
        value: /var/data/ehr.sqlite
      - key: EHR_TZ
        value: America/Phoenix
      - key: EHR_CLINIC_NAME
        sync: false
      # Operator: token for /ops/status, and the list of customer clinics shown under Administration → Customers.
      - key: EHR_OPS_TOKEN
        generateValue: true
      - key: EHR_FLEET
        sync: false
      - key: EHR_ADMIN_EMAIL
        sync: false
      - key: EHR_ADMIN_PASSWORD
        sync: false
      # AI note compliance review (optional). Turn on only after signing a BAA with Anthropic.
      # Set to 1 in the Render dashboard to turn it on (not pinned here, so a Blueprint sync won't switch it back off).
      - key: EHR_AI_REVIEW
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Only needed if the key spans several workspaces and requests are refused.
      - key: ANTHROPIC_WORKSPACE_ID
        sync: false
      # Encrypted backups (HIPAA contingency plan). Without EHR_BACKUP_KEY backups are DISABLED.
      # Generate: node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
      # and keep a copy in your password manager: without it, backups cannot be decrypted.
      # Backups on this same disk are NOT enough on their own: off-site copies are still required
      # (Render disk snapshots, or copying to a HIPAA-covered object store under a BAA).
      - key: EHR_BACKUP_KEY
        sync: false
      - key: EHR_BACKUP_DIR
        value: /var/data/backups
      # End-of-day outstanding-notes emails (counts only, no patient information). See /ehr/admin/email.
      # Render free instances block SMTP ports: use resend there; Gmail SMTP works on paid instances.
      - key: EHR_MAIL_PROVIDER
        sync: false
      - key: EHR_MAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EHR_SMTP_HOST
        sync: false
      - key: EHR_SMTP_PORT
        sync: false
      - key: EHR_SMTP_USER
        sync: false
      - key: EHR_SMTP_PASS
        sync: false
      # Site address used in emailed/texted check-in links.
      - key: EHR_PUBLIC_URL
        sync: false
      # Automatic check-in links before appointments (email and/or text). Texts go through Twilio (sign its BAA).
      - key: EHR_CHECKIN_LEAD_MINUTES
        value: "60"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: EHR_DIGEST_TIME
        value: "16:30"
      - key: EHR_DIGEST_DAYS
        value: "1-5"

  # Demo copy: fictional staff + patients, free instance, no disk.
  # The database resets to fresh sample data whenever the instance restarts.
  # The login page lists the demo accounts. Never enter real information here.
  - type: web
    name: clinic-ready-demo
    runtime: node
    plan: free
    rootDir: ehr
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: EHR_DEMO
        value: "1"
      - key: EHR_TZ
        value: America/Phoenix
